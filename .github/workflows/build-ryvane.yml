name: Build Ryvane Tweaks

on:
  workflow_dispatch:
  push:
    branches: [ryvane-build]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app | Out-Null
          $parts = Get-ChildItem payload\part*.txt | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("$PWD\ryvane-src.tar.xz", [Convert]::FromBase64String($b64))
          tar -xJf ryvane-src.tar.xz -C app
          $main = Get-Content app\electron\main.ts -Raw
          $main = $main.Replace(', nativeImage', '')
          $main = $main -replace '(?m)^\s*const icon = nativeImage\.createFromPath\(iconPath\);\r?\n', ''
          $main = $main -replace '(?m)^\s*icon: icon\.isEmpty\(\) \? undefined : icon,\r?\n', ''
          Set-Content app\electron\main.ts $main -NoNewline

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: app
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Ryvane-Windows-Installer
          path: app/release/*.exe
          if-no-files-found: error
